<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TechWear Shop — Registrarse</title>
    <link rel="icon" href="../img/logo/icon.png" type"image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/general.css" />
  </head>
  <body>
    <div>
      <header>
        <div>
          <a href="../index.html"
            ><img src="../img/logo/logo.png" alt="logo de TechWear Shop" /> TechWear
            Shop</a
          >
          <nav aria-label="Principal">
            <ul>
              <li><a href="../index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
              <li>
                <a href="cart.html"
                  ><i class="fa-solid fa-cart-shopping"></i> Carrito</a
                >
              </li>
              <li><a href="login.html"><i class="fa-solid fa-user"></i> Ingresar</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <main>
        <section>
          <h2>Crear una cuenta</h2>
          <hr />
          <form action="login.html" method="get">
            <div>
              <label for="first">Nombre</label>
              <input id="first" name="first" type="text" required />
            </div>
            <div>
              <label for="last">Apellido</label>
              <input id="last" name="last" type="text" required />
            </div>

            <div>
              <label for="email">Correo electrónico</label>
              <input id="email" name="email" type="email" required />
            </div>
            <div>
              <label for="phone">Teléfono</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                placeholder="+593 555 555 5555"
              />
            </div>

            <div>
              <label for="password">Contraseña</label>
              <input id="password" name="password" type="password" required />
            </div>
            <div>
              <label for="confirm">Confirmar contraseña</label>
              <input id="confirm" name="confirm" type="password" required />
            </div>

            <div>
              <label for="company">Empresa</label>
              <input id="company" name="company" type="text" />
            </div>

            <div>
              <label for="address1">Dirección 1</label>
              <input id="address1" name="address1" type="text" />
            </div>
            <div>
              <label for="address2">Dirección 2</label>
              <input id="address2" name="address2" type="text" />
            </div>

            <div>
              <label for="city">Ciudad</label>
              <input id="city" name="city" type="text" />
            </div>
            <div>
              <label for="state">Provincia / Estado</label>
              <input id="state" name="state" type="text" />
            </div>

            <div>
              <label for="zip">Código postal</label>
              <input id="zip" name="zip" type="text" />
            </div>
            <div>
              <label for="country">País</label>
              <select id="country" name="country">
                <option value="">Selecciona un país</option>
                <option value="US">Ecuador</option>
                <option value="ES">España</option>
                <option value="UK">Estados Unidos</option>
                <option value="OTHER">Otro</option>
              </select>
            </div>

            <div>
              <label for="dob">Fecha de nacimiento</label>
              <input id="dob" name="dob" type="date" />
            </div>
            
            <div>
              <label><input type="checkbox" name="newsletter" /> Suscribirse al
                boletín</label>
            </div>

            <div>
              <label><input type="checkbox" name="terms" required /> Acepto los
                términos y la política de privacidad</label>
            </div>

            <div style="text-align: center; margin-top: 16px;">
              <button type="submit">Crear cuenta</button>
            </div>
          </form>
          <hr />
        </section>
      </main>

      <footer>
        <div>
          <p>&copy; 2026 TechWear Shop. All rights reserved.</p>
        </div>
      </footer>
    </div>
  </body>
</html>
