<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TechWear Shop — Iniciar sesión</title>
    <link rel="icon" href="../img/logo/icon.png" type"image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/general.css" />
  </head>
  <body>
    <div>
      <header>
        <div>
          <a href="../index.html"
            ><img src="../img/logo/logo.png" alt="logo de TechWear Shop" /> TechWear
            Shop</a
          >
          <nav aria-label="Principal">
            <ul>
              <li><a href="../index.html"> <i class="fa-solid fa-house"></i> Inicio</a></li>
              <li>
                <a href="cart.html"
                  ><i class="fa-solid fa-cart-shopping"></i> Carrito</a
                >
              </li>
              <li><a href="login.html"><i class="fa-solid fa-user"></i> Ingresar</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <main>
        <section aria-labelledby="signin-title">
          <h2 id="signin-title">Inicia sesión en tu cuenta</h2>
          <hr />
          <form action="../index.html" method="post">
            <label for="email">Correo electrónico</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="tu@correo.com"
              required
            />

            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="••••••••"
              required
            />
            <div style="text-align: center; margin-top: 16px;">
              <button type="submit">Iniciar sesión</button>
            </div>
            
          </form>
          <hr />
          <p>
            ¿No tienes cuenta? <a href="register.html">Crear cuenta</a>
          </p>
        </section>
      </main>

      <footer>
        <div>
          <p>&copy; 2026 TechWear Shop. All rights reserved.</p>
        </div>
      </footer>
    </div>
  </body>
</html>
